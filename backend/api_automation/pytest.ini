[pytest]
# Pytest configuration for API automation framework

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --alluredir=allure-results

# Markers
markers =
    smoke: Quick sanity tests (select a subset)
    regression: Full regression test suite
    positive: Happy path / positive scenario tests
    negative: Error scenario / negative tests
    slow: Tests that take a long time to run
    integration: Integration tests across multiple endpoints

# Logging
log_cli = false
log_cli_level = INFO
log_file = pytest.log
log_file_level = DEBUG

# Asyncio
asyncio_mode = auto

# Timeout
timeout = 30
